app = "shred-day-worker"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "300s"

[build]
  dockerfile = "server/Dockerfile"

[processes]
  app = "bundle exec puma -C config/puma_worker.rb"

[env]
  ACTIVE_STORAGE_SERVICE = "tigris"
  SOLID_QUEUE_IN_PUMA = "false"
  WAKE_WORKER_ON_ENQUEUE = "false"
  WORKER_WAKE_URL = "http://shred-day-worker.flycast/wake"
  JOB_THREADS = "1"
  JOB_CONCURRENCY = "1"
  JOB_POLL_INTERVAL = "1"
  WORKER_IDLE_SECONDS = "60"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20
  [[http_service.checks]]
    method = "GET"
    path = "/up"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"

[[restart]]
  policy = "on-failure"
  retries = 3
